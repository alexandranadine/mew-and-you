<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffbf6" />
    <meta name="color-scheme" content="light" />

    <!-- Default tags for crawlers that do not run JavaScript. Route-specific
         titles, descriptions, canonicals, and social tags are applied in-app. -->
    <title>Mew & You — Adoptable Cats in LA County</title>
    <meta
      name="description"
      content="Browse adoptable cats from shelters and rescues across Los Angeles County, all in one cozy place."
    />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Hero peek art is above-the-fold on the landing route; preload for LCP. -->
    <link
      rel="preload"
      as="image"
      href="/images/mew-and-you-cat-peek.png"
      fetchpriority="high"
    />

    <meta property="og:site_name" content="Mew & You" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mew & You — Adoptable Cats in LA County" />
    <meta
      property="og:description"
      content="Browse adoptable cats from shelters and rescues across Los Angeles County, all in one cozy place."
    />
    <meta property="og:image" content="/images/mew-and-you-cat-peek.png" />
    <meta
      property="og:image:alt"
      content="Illustrated calico kitten peeking over an edge, surrounded by flowers and yarn"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mew & You — Adoptable Cats in LA County" />
    <meta
      name="twitter:description"
      content="Browse adoptable cats from shelters and rescues across Los Angeles County, all in one cozy place."
    />
    <meta name="twitter:image" content="/images/mew-and-you-cat-peek.png" />
    <meta
      name="twitter:image:alt"
      content="Illustrated calico kitten peeking over an edge, surrounded by flowers and yarn"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
